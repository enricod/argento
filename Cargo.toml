[workspace]
resolver = "3"
members = ["crates/argento-core", "crates/argento-io", "crates/argento-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
argento-core = { path = "crates/argento-core" }
argento-io = { path = "crates/argento-io" }

# The image processing is too slow unoptimised for a fluid preview, even
# during development.
[profile.dev.package.argento-core]
opt-level = 3
