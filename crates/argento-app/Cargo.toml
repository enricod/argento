[package]
name = "argento-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "argento"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
argento-core.workspace = true
argento-io.workspace = true
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }

[build-dependencies]
glib-build-tools = "0.22"
